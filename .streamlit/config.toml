# Theme settings are commented out to allow users to customize via Streamlit Cloud settings
# Uncomment these lines if you want to force a specific theme
# [theme]
# primaryColor = "#FF6B6B"
# backgroundColor = "#0E1117"
# secondaryBackgroundColor = "#262730"
# textColor = "#FAFAFA"
# font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
# Reduce disconnected session TTL to free memory faster after page reloads
# Default is ~10-15 minutes; we use 60 seconds to prevent memory buildup
disconnectedSessionTTL = 60

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = true
