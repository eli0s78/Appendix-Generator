# Theme settings are commented out to allow users to customize via Streamlit Cloud settings
# Uncomment these lines if you want to force a specific theme
# [theme]
# primaryColor = "#FF6B6B"
# backgroundColor = "#0E1117"
# secondaryBackgroundColor = "#262730"
# textColor = "#FAFAFA"
# font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
# Aggressive memory cleanup: clean up disconnected sessions after 1 second
# Default is ~10-15 minutes. With 1s TTL, page refresh = fresh session (as intended).
# This prevents memory buildup from reload cycles (load book → save → reload → repeat)
disconnectedSessionTTL = 1

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = true
